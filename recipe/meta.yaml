{% set name = "astromodels" %}
{% set version = "2.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/astromodels-{{ version }}.tar.gz
  sha256: 8e9e3a277b24eded7a4e7149857df0be4abe70921a219c15a4d55dc1a935e13e

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1
  skip: true  # [win]
  skip: true  # [py<=310]
  skip: true  # [py>=313]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - numpy
    - pip
    - setuptools
    - versioneer
  run:
    - llvmlite <0.46
    - versioneer
    - astropy >=7.2
    - python
    - numpy >=1.26
    - pyyaml >=5.1
    - scipy >=0.14
    - astropy-base >=1.2
    - dill
    - future
    - interpolation >=2.2.3
    - numba
    - h5py
    - pandas
    - pytables
    - colorama
    - omegaconf
    - rich
    - joblib

test:
  imports:
    - astromodels
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/threeml/astromodels
  summary: Astromodels contains models to be used in likelihood or Bayesian analysis in astronomy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
